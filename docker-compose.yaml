version: "3.9"

services:
  db:
    image: mariadb:11
    container_name: adviseme-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_pass
      MARIADB_DATABASE: adviseme
      MARIADB_USER: adviseme_app
      MARIADB_PASSWORD_FILE: /run/secrets/dbapppass
    volumes:
      - dbdata:/var/lib/mysql
      - ./DB/AdviseMeDB.sql:/docker-entrypoint-initdb.d/AdviseMeDB.sql:ro
    secrets:
      - db_root_pass
      - dbapppass
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -uroot -p\"$(cat /run/secrets/db_root_pass)\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - adviseme-net

  db-setup:
    image: mysql:8.0
    depends_on:
      db:
        condition: service_healthy
    networks: [adviseme-net]
    volumes:
      - ./scripts:/scripts:ro
    environment:
      MYSQL_HOST: adviseme-db
      MYSQL_USER: root
      MYSQL_PWD_FILE: /run/secrets/db_root_pass
      DB_NAME: adviseme
    secrets:
      - db_root_pass
    restart: "no"
    command: >
      sh -lc '
        set -euo pipefail;
        echo "Running DB setup...";
        /scripts/setup.sh
      '

  openldap:
    image: osixia/openldap:1.5.0
    container_name: adviseme-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "UAFS"
      LDAP_DOMAIN: "adviseme.local"
      LDAP_BASE_DN: "dc=adviseme,dc=local"
      LDAP_ADMIN_PASSWORD: admin_pass
      LDAP_READONLY_USER: "false"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_LOG_LEVEL: "256"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/provisions:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -D 'cn=admin,dc=adviseme,dc=local' -w admin_pass -b 'dc=adviseme,dc=local' -s base '(objectClass=*)' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - adviseme-net

  auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile
    container_name: adviseme-auth
    restart: unless-stopped
    environment:
      LDAP_HOST: adviseme-openldap
      LDAP_PORT: 389
      LDAP_BASE_DN: dc=adviseme,dc=local
      JWT_SECRET: change-me
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - adviseme-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: adviseme-core
    restart: unless-stopped
    environment:
      DB_HOST: adviseme-db
      DB_USER: adviseme_app
      DB_PASS: /scripts/secrets/db_root_pass.txt
      DB_NAME: adviseme
      JWT_SECRET: change-me
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      # If db-setup must finish before core:
      # db-setup:
      #   condition: service_completed_successfully
      auth-api:
        condition: service_started
    networks:
      - adviseme-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
  ldap-data:
  ldap-config:

secrets:
  db_root_pass:
    file: ./scripts/secrets/db_root_pass.txt
  dbapppass:
    file: ./scripts/secrets/dbapppass.txt

networks:
  adviseme-net:
