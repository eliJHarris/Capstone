version: "3.9"

services:
  db:
    image: mariadb:latest
    container_name: adviseme-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: pass
      MARIADB_DATABASE: adviseme
      MARIADB_USER: root
      MARIADB_PASSWORD: pass
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
