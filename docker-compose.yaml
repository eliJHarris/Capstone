version: "3.9"

services:
  db:
    image: mariadb:latest
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    container_name: adviseme-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: pass
      MARIADB_DATABASE: adviseme
      MARIADB_USER: adviseme_app
      MARIADB_PASSWORD: app_pass

#    healthcheck:
#      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
#             "-u", "adviseme_app", "--password=app_pass"]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#    networks:
#      - adviseme-net

  api:
    build:
        dockerfile: ./api/Dockerfile
    ports:
        - "8000:80"
    volumes:
        - ./api:/code
    tty: true

volumes:
  dbdata:
