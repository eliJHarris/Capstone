version: "3.9"

services:
  db:
    image: mariadb:11
    container_name: adviseme-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: adviseme
      MARIADB_USER: adviseme_app
      MARIADB_PASSWORD: ${DB_APP_PASSWORD?Set DB_APP_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
      - ./DB/AdviseMeDB.sql:/docker-entrypoint-initdb.d/AdviseMeDB.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - adviseme-net

  openldap:
    image: osixia/openldap:1.5.0
    container_name: adviseme-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "UAFS"
      LDAP_DOMAIN: "adviseme.local"
      LDAP_BASE_DN: "dc=adviseme,dc=local"
      LDAP_READONLY_USER: "false"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD?Set LDAP_ADMIN_PASSWORD in .env}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD?Set LDAP_ADMIN_PASSWORD in .env}

      LDAP_TLS: "false"

      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_LOG_LEVEL: "256"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      # certs still mounted but not required anymore; safe to keep
      - ./ldap/certs:/container/service/slapd/assets/certs
    ports:
      - "389:389"
      # 636 not needed without TLS, but ok if you want to keep it closed:
      # - "636:636"
    networks:
      - adviseme-net

  auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile
    container_name: adviseme-auth
    restart: unless-stopped
    environment:
      LDAP_HOST: adviseme-openldap
      LDAP_BASE_DN: dc=adviseme,dc=local
      LDAP_PEOPLE_DN: ou=People,dc=adviseme,dc=local
      
      LDAP_BIND_DN: cn=admin,dc=adviseme,dc=local
      LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD?Set LDAP_ADMIN_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET?Set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: "60"
      ALLOWED_ORIGINS: "https://localhost,https://localhost:5173,https://localhost:3000,https://adviseme.local"

      LDAP_PORT: 389
      LDAP_USE_SSL: "false"
      LDAP_TLS_VALIDATE: "false"
      # LDAP_CA_CERT_FILE no longer needed
    expose:
      - "8080"
    depends_on:
      - openldap
    networks:
      - adviseme-net

  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: adviseme-api
    restart: unless-stopped
    volumes:
      - ./pdf_scraper:/code/pdf_scraper:ro
    environment:
      DB_HOST: adviseme-db
      DB_USER: adviseme_app
      DB_NAME: adviseme
      DB_PASSWORD: ${DB_APP_PASSWORD?Set DB_APP_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET?Set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT?Set SMTP_PORT in .env}
      SMTP_USER: ${SMTP_USER?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD?Set SMTP_PASSWORD in .env}
      SMTP_FROM: ${SMTP_FROM?Set SMTP_FROM in .env}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adviseme-net


  frontend:
    build:
      context: ./front-end
    container_name: adviseme-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - auth-api
      - api-service
    networks:
      - adviseme-net

  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: adviseme-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - auth-api
      - api-service
    volumes:
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./reverse-proxy/certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    environment:
      TLS_DOMAINS: ${TLS_DOMAINS:-localhost,127.0.0.1,adviseme.local}
      TLS_DAYS: ${TLS_DAYS:-365}
    command:
      [
        "/bin/sh",
        "-c",
        "apk add --no-cache openssl >/dev/null && /etc/nginx/certs/generate-selfsigned.sh && nginx -g 'daemon off;'"
      ]
    networks:
      - adviseme-net

volumes:
  dbdata:
  ldap-data:
  ldap-config:

networks:
  adviseme-net:
