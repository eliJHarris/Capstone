version: "3.9"

services:
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: capstone_frontend
    ports:
      - "8080:8080"    # change if your front-end uses a different port
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capstone_api
    ports:
      - "8000:8000"    # change if your API uses a different port
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

networks:
  default:
    driver: bridge