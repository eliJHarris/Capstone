version: "3.9"

services:
  db:
    image: mariadb:10
    volumes:
      - ./DB/test:/docker-entrypoint-initdb.d #remove /test ot build adviseme db
    ports:
      - "3306:3306"
    container_name: adviseme-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: pass
      MARIADB_DATABASE: adviseme
      MARIADB_USER: adviseme_app
      MARIADB_PASSWORD: app_pass

  api:
    build:
        dockerfile: ./api/Dockerfile
    ports:
        - "8000:80"
    volumes:
        - ./api:/code
    tty: true
